apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fs-platform.fullname" . }}-api
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # E-ARCH-02: rolling restarts with zero failed requests
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fs-platform.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "fs-platform.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "fs-platform.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "fs-platform.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: {{ include "fs-platform.image" (list . .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "fsweb.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
                    "--forwarded-allow-ips", "*", "--no-server-header", "--workers", {{ .Values.api.workers | quote }}]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- include "fs-platform.envFrom" . | nindent 12 }}
          env:
            {{- include "fs-platform.secretEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]  # let the load balancer drain before shutdown
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: work, mountPath: /work }
            - { name: audit-heads, mountPath: /audit-heads }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: work
          emptyDir: { sizeLimit: 5Gi }
        - name: audit-heads
          emptyDir: {}  # head files are also shipped to the backup bucket by the audit-chain CronJob
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
