apiVersion: v1
kind: Service
metadata:
  name: {{ include "fs-platform.fullname" . }}-api
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "fs-platform.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
