{{- if .Values.migrations.enabled }}
# Alembic migrations as a pre-install/pre-upgrade hook, with the OWNER role (the runtime role cannot
# change schema or RLS policies). Take a database backup before upgrades (docs/admin-guide.md §Upgrades).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fs-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "fs-platform.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "fs-platform.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "fs-platform.image" (list . .Values.image.api) }}
          command: ["python", "-m", "fsweb.manage", "migrate"]
          envFrom:
            {{- include "fs-platform.envFrom" . | nindent 12 }}
          env:
            {{- include "fs-platform.secretEnvFor" (list . (without (splitList " " (include "fs-platform.secretKeys" .)) "FSWEB_DATABASE_URL")) | nindent 12 }}
            - name: FSWEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: FSWEB_OWNER_DATABASE_URL
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
