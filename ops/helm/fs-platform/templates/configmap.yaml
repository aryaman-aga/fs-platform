apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fs-platform.fullname" . }}-config
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
data:
  FSWEB_ENV: {{ .Values.config.env | quote }}
  FSWEB_STORAGE: {{ .Values.config.storage | quote }}
  FSWEB_S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  FSWEB_S3_REGION: {{ .Values.config.s3Region | quote }}
  FSWEB_COOKIE_SECURE: "true"
  FSWEB_ALLOWED_ORIGINS: {{ printf "https://%s" .Values.config.siteHost | quote }}
  FSWEB_PUBLIC_BASE_URL: {{ printf "https://%s" .Values.config.siteHost | quote }}
  FSWEB_OFFICE_CIDRS: {{ .Values.config.officeCidrs | quote }}
  FSWEB_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  FSWEB_OIDC_CLIENT_ID: {{ .Values.config.oidcClientId | quote }}
  FSWEB_AI_ENABLED: {{ .Values.config.aiEnabled | toString | quote }}
  FSWEB_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FSWEB_WORK_DIR: "/work"
  FSWEB_AUDIT_HEAD_DIR: "/audit-heads"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  OTEL_SERVICE_NAME: "fsweb"
  TZ: "UTC"
