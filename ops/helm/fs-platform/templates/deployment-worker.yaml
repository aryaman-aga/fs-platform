apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fs-platform.fullname" . }}-worker
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "fs-platform.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "fs-platform.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "fs-platform.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 300  # let a running check / render finish (jobs are idempotent anyway)
      containers:
        - name: worker
          image: {{ include "fs-platform.image" (list . .Values.image.worker) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - fsweb.worker
            {{- with .Values.worker.queues }}
            - --queues
            - {{ join "," . | quote }}
            {{- end }}
          envFrom:
            {{- include "fs-platform.envFrom" . | nindent 12 }}
          env:
            {{- include "fs-platform.secretEnv" . | nindent 12 }}
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: work, mountPath: /work }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: work
          emptyDir: { sizeLimit: {{ .Values.worker.workDirSizeLimit }} }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
