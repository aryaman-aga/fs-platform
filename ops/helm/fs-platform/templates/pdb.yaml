apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fs-platform.fullname" . }}-api
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "fs-platform.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fs-platform.fullname" . }}-worker
  labels:
    {{- include "fs-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "fs-platform.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
