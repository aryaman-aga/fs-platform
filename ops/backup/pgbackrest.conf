# pgBackRest for the FS-Platform PostgreSQL cluster (07 §2: full weekly + differential daily +
# continuous WAL archive; 35 days of point-in-time recovery). Installed in the postgres image.
# The repository volume is then copied by restic to the NAS and to off-site object storage
# (ops/backup/restic-backup.sh), whose retention keeps monthly fulls 12 months and yearly fulls
# 8 years. The cipher pass comes from PGBACKREST_REPO1_CIPHER_PASS (split 2-of-3, E-BCP-02).
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=35
repo1-retention-archive-type=full
repo1-bundle=y
compress-type=zst
compress-level=3
start-fast=y
archive-async=y
archive-push-queue-max=4GiB
spool-path=/var/spool/pgbackrest
process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[fs]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
