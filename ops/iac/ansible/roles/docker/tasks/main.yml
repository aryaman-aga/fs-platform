- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Docker engine and compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker daemon defaults (log rotation, no inter-container traffic on the default bridge)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "20m", "max-file": "10"},
       "icc": false, "live-restore": true, "userland-proxy": false, "no-new-privileges": true}

- name: Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
