# chrony configuration for every FS-Platform host (E-SEC-05, CERT-In Directions 2022:
# ICT system clocks synchronised with the NTP servers of NIC or NPL, or with servers traceable to them).
# Install: /etc/chrony/chrony.conf (Debian/Ubuntu) then `systemctl restart chrony`; verify with
# `chronyc sources -v` and `chronyc tracking`. Windows render workers: see ops/runbooks/restore-render-worker.md.

# National Informatics Centre (NIC)
server samay1.nic.in iburst
server samay2.nic.in iburst
# National Physical Laboratory (NPL), the national time-keeping authority
server time.nplindia.org iburst

# Fallback only if all of the above are unreachable for a long time (log and alert on use).
# pool in.pool.ntp.org iburst maxsources 2

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
leapsectz right/UTC
logdir /var/log/chrony
log tracking measurements statistics
# Alert (ClockNotSynchronised) when node_timex_sync_status is 0 or the offset exceeds 500 ms.
