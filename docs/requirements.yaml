# Requirement register used by tools/traceability.py to build docs/TRACEABILITY.md.
# Engine rule IDs come from fscore/src/fscore/rules/rules.yaml; this file lists the
# platform requirements (12 §2), engagement controls (06 §2) and fixed preferences (03 §3).
# tier: T1 = before go-live, T2 = within 6 months, T3 = when scaling.
controls:
  C1: Source files immutable
  C2: Maker-checker on fix plans
  C3: Balancing adjustments limited to rounding
  C4: No typed plugs introduced
  C5: Post-write verification
  C6: Narrative as typed text
  C7: PDF matches workbook
  C8: Signatory master
  C9: AI egress approval bound to payload hash
  C10: Segregation of duties
  C11: Period scope
  C12: Change after release (diff)
  C13: Backups and restore drills
  C14: Access review
requirements:
  E-ARCH-01: {tier: T1, title: High-availability profile}
  E-ARCH-02: {tier: T1, title: Stateless services}
  E-ARCH-03: {tier: T2, title: Render-worker pool}
  E-ARCH-04: {tier: T2, title: Deployment targets and infrastructure as code}
  E-ARCH-05: {tier: T1, title: Idempotent jobs and transactional outbox}
  E-ARCH-06: {tier: T2, title: API versioning and signed webhooks}
  E-ARCH-07: {tier: T3, title: Multi-office / multi-firm readiness}
  E-SEC-01: {tier: T1, title: SSO (OIDC / SAML) and SCIM}
  E-SEC-02: {tier: T1, title: Attribute-based access control}
  E-SEC-03: {tier: T1, title: Privileged access (step-up MFA, JIT elevation, break-glass)}
  E-SEC-04: {tier: T2, title: Access recertification}
  E-SEC-05: {tier: T1, title: CERT-In incident reporting and log retention}
  E-SEC-06: {tier: T1, title: DPDP Act data-principal rights and breach workflow}
  E-SEC-07: {tier: T1, title: Key management and field-level encryption}
  E-SEC-08: {tier: T1, title: Threat model and ASVS traceability}
  E-SEC-09: {tier: T2, title: Mode B hardening}
  E-SEC-10: {tier: T1, title: Leak controls (watermarks, expiring links)}
  E-SEC-11: {tier: T2, title: SIEM integration}
  E-SEC-12: {tier: T2, title: Secure SDLC (SAST, SBOM, signed images)}
  E-ITGC-01: {tier: T1, title: Change management}
  E-ITGC-02: {tier: T1, title: Rule-change regression control}
  E-ITGC-03: {tier: T1, title: Access management}
  E-ITGC-04: {tier: T1, title: Operations}
  E-ITGC-05: {tier: T2, title: Segregation of environments}
  E-ITGC-06: {tier: T2, title: Control matrix and evidence pack}
  E-DATA-01: {tier: T1, title: Trial-balance validation gate}
  E-DATA-02: {tier: T1, title: Versioned mapping library}
  E-DATA-03: {tier: T1, title: Concurrency (check-out / check-in, optimistic locking)}
  E-DATA-04: {tier: T2, title: Lineage graph}
  E-DATA-05: {tier: T2, title: Offline package integrity}
  E-DATA-06: {tier: T2, title: Records management}
  E-RULE-01: {tier: T1, title: Rule registry}
  E-RULE-02: {tier: T1, title: Template library}
  E-RULE-03: {tier: T1, title: Re-run reproducibility}
  E-RULE-04: {tier: T2, title: Regulatory update process}
  E-RULE-05: {tier: T2, title: Rule-quality analytics}
  E-PREP-01: {tier: T1, title: Year-end rollover}
  E-PREP-02: {tier: T1, title: Disclosure checklist engine}
  E-PREP-03: {tier: T2, title: Consolidation module}
  E-PREP-04: {tier: T2, title: Additional frameworks}
  E-PREP-05: {tier: T2, title: Multi-currency engine}
  E-PREP-06: {tier: T3, title: Statutory outputs (XBRL, CARO)}
  E-PREP-07: {tier: T2, title: Notes authoring workspace}
  E-INT-01: {tier: T2, title: TB connectors}
  E-INT-02: {tier: T2, title: Document stores}
  E-INT-03: {tier: T2, title: Notifications}
  E-INT-04: {tier: T2, title: Signing workflow and UDIN}
  E-INT-05: {tier: T3, title: Practice-management and billing export}
  E-INT-06: {tier: T2, title: Inbound webhooks / API keys}
  E-OPS-01: {tier: T1, title: SLOs and error budgets}
  E-OPS-02: {tier: T1, title: OpenTelemetry tracing and correlation IDs}
  E-OPS-03: {tier: T2, title: Status page}
  E-OPS-04: {tier: T1, title: Alert runbooks and on-call}
  E-OPS-05: {tier: T1, title: Performance and load testing}
  E-OPS-06: {tier: T2, title: Support model}
  E-OPS-07: {tier: T1, title: Documentation, training, in-app help}
  E-OPS-08: {tier: T2, title: Feature flags and canary releases}
  E-AI-01: {tier: T1, title: AI policy}
  E-AI-02: {tier: T1, title: AI evaluation set}
  E-AI-03: {tier: T1, title: Prompt and model registry}
  E-AI-04: {tier: T2, title: AI cost and rate controls}
  E-AI-05: {tier: T1, title: Human-in-the-loop guarantee}
  E-BCP-01: {tier: T1, title: Business continuity plan}
  E-BCP-02: {tier: T1, title: Key escrow (Shamir 2-of-3)}
  E-BCP-03: {tier: T2, title: Warm DR site}
  E-BCP-04: {tier: T2, title: Tabletop exercises}
  E-BIZ-01: {tier: T2, title: Usage metering and plans}
  E-BIZ-02: {tier: T3, title: GST-compliant invoicing}
# Control matrix (docs/CONTROL_MATRIX.md, generated): for each engagement control and IT general control,
# the code that enforces it and the tests that prove it. Every path, symbol and test name is checked by
# tools/traceability.py --check. Python tests are "file::function"; UI tests are "file::title".
control_matrix:
  C1:
    code: [fscore/src/fscore/fix/apply.py::apply_plan, fscore/src/fscore/fix/text.py::apply_text, fsweb/src/fsweb/services/common.py::store_version, fsweb/src/fsweb/storage.py::LocalStorage]
