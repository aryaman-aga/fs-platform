[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fsweb"
version = "1.0.0"
description = "FS-Platform web platform (Mode A): auth + MFA, RBAC/ABAC + RLS, engagements, versions, jobs, audit chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fscore",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "joserfc>=1.0",  # OIDC ID-token validation (fsweb.security.oidc)
  "itsdangerous>=2.1",  # imported by fsweb.routers.auth
  "cryptography>=42",
  "boto3>=1.34",
  "prometheus-client>=0.20",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = ["pytest>=8", "pytest-asyncio", "freezegun>=1.4", "moto[s3]>=5", "ruff", "mypy"]

[project.scripts]
fsweb-manage = "fsweb.manage:main"
fsweb-worker = "fsweb.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsweb = ["data/*", "authz/policies/*.yaml", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: needs a PostgreSQL server (FSWEB_TEST_PG_URL)",
  "engine: calls the real fscore engine (skipped while it is unavailable)",
  "slow: long-running tests",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
