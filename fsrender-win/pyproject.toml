[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fsrender-win"
version = "1.0.0"
description = "FS-Platform Windows render worker: pulls render jobs from the internal queue and exports PDFs with licensed Microsoft Excel (COM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27",
  "fscore",          # provides fscore.pdf.render_excel_com.export_pdf
]

[project.optional-dependencies]
win = ["pywin32>=306; sys_platform == 'win32'", "psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
fsrender-win = "fsrender_win.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
