# Secret scanning (gitleaks, CI security job): the default rules, plus an allowlist for the synthetic
# credentials that are part of the code base on purpose. None is valid outside a local development
# database or a test: the demo password is only seeded by `fsweb.manage seed-demo`, which refuses to run in
# production or offline mode; the others exist only in tests. Synthetic passwords contain "Ledger" by
# convention; the last entries are code identifiers that merely look random (not secrets).
title = "fs-platform"

[extend]
useDefault = true

[allowlist]
description = "Synthetic demo and test credentials"
regexes = [
  '''Ledger''',
  '''AbCde-FgHij-KmNpq-RsTuv''',
  '''k3y-0f-th3-launch3r-Zq9''',
  '''0ne-T1me-t0ken''',
  '''wrong-password-123''',
  '''^password_change_required$''',
  '''^FSWEB_SETUP_TOKEN_FILE$''',
  '''^setSessionEndHandler$''',
]
