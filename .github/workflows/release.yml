# Release sketch (E-ITGC-01, E-SEC-12): tag → images → SBOM → signatures. Promotion to production stays manual
# and needs a release ticket approved by someone other than the author. Firm-server releases only: the Windows desktop
# edition is released with `desktop-v*` tags (fsoffline/README.md), which this workflow does not match.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (Sigstore OIDC)

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: fs-platform-api
            dockerfile: ops/docker/python.Dockerfile
            target: api
          - name: fs-platform-worker
            dockerfile: ops/docker/python.Dockerfile
            target: worker
          - name: fs-platform-ui
            dockerfile: ops/docker/ui.Dockerfile
            target: ""
          - name: fs-platform-postgres
            dockerfile: ops/docker/postgres.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v5
      - name: Release ticket referenced in the tag message
        run: |
          git fetch --tags --force
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | grep -Eq 'REL-[0-9]{4}-[0-9]{3}' \
            || { echo "tag annotation must reference a release ticket (REL-YYYY-NNN)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      # pinned by commit: the action's old tags were removed after the March 2026 compromise; v0.36.0 is an
      # immutable release
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
